name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: tests (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest release hacs.json allows.
          - ha: "2025.10.0"
            python: "3.13"
            install: >-
              pip install pytest-homeassistant-custom-component==0.13.285 "pycares<5"
              -r requirements_dev.txt
          # The newest release pytest-homeassistant-custom-component supports.
          - ha: latest (custom-component test package)
            python: "3.14"
            install: pip install -r requirements_test.txt
          # Home Assistant 2026.11+, with its own pytest-homeassistant package.
          - ha: "2026.11.0"
            python: "3.14"
            install: HA_VERSION=2026.11.0 scripts/setup && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: ${{ matrix.install }}
      - run: python -c "from homeassistant.const import __version__; print(__version__)"
      - run: scripts/test
