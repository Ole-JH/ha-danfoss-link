name: Release

# Creates the git tag and GitHub release for the version in manifest.json.
# Versions with a PEP 440 pre-release suffix (a, b, rc, e.g. 0.3.0b1) are
# published as pre-releases. Does nothing if the tag already exists.

on:
  push:
    branches: [main]
    paths:
      - custom_components/danfoss_link/manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(jq -r .version custom_components/danfoss_link/manifest.json)
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::Unsupported version '$version' in manifest.json"
            exit 1
          fi
          prerelease=false
          [[ "$version" =~ (a|b|rc)[0-9]+$ ]] && prerelease=true
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          args=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG exists, creating the release for it."
            args=(--verify-tag --title "$TAG" --generate-notes)
          fi
          [[ "$PRERELEASE" == true ]] && args+=(--prerelease)
          gh release create "$TAG" "${args[@]}"
